version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: casha-postgres
    environment:
      POSTGRES_USER: casha
      POSTGRES_PASSWORD: casha_dev_password
      POSTGRES_DB: casha
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casha -d casha"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
